<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOEL-XMD | Pair</title>
    <style>
        body { background: #000; color: #ff00ff; font-family: 'Courier New', monospace; text-align: center; }
        .container { border: 2px solid #ff00ff; padding: 20px; display: inline-block; margin-top: 50px; border-radius: 10px; background: #111; }
        input { padding: 10px; width: 80%; background: #222; border: 1px solid #0ff; color: #fff; margin: 10px 0; }
        button { background: #ff00ff; color: white; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        #code { font-size: 2.5em; color: #0ff; margin-top: 20px; text-shadow: 0 0 10px #0ff; }
    </style>
</head>
<body>
    <div class="container">
        <h2>PAIRING CODE</h2>
        <input type="number" id="phone" placeholder="2547XXXXXXXX">
        <br>
        <button id="btn" onclick="getPair()">GET CODE</button>
        <div id="code"></div>
    </div>

    <script>
        async function getPair() {
            const num = document.getElementById('phone').value;
            const btn = document.getElementById('btn');
            const codeDiv = document.getElementById('code');
            if(!num) return alert("Enter Number!");

            btn.innerText = "GENERATING...";
            btn.disabled = true;

            try {
                const res = await fetch(`/pair?phone=${num}`);
                const data = await res.json();
                codeDiv.innerText = data.code || "FAILED";
            } catch (e) {
                codeDiv.innerText = "ERROR";
            } finally {
                btn.innerText = "GET CODE";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
