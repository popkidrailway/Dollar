<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOEL-XMD Session</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #0f0f0f; color: white; text-align: center; padding: 50px; }
        .container { background: #1a1a1a; padding: 30px; border-radius: 15px; border: 1px solid #ff00ff; display: inline-block; }
        h1 { color: #ff00ff; text-transform: uppercase; }
        .btn { display: block; width: 200px; padding: 15px; margin: 10px auto; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; font-weight: bold; }
        .qr { background: #00ffff; color: black; }
        .pair { background: #ff00ff; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>JOEL-XMD V10</h1>
        <p>Choose your connection method:</p>
        <a href="/qr" class="btn qr">SCAN QR CODE</a>
        <a href="/code" class="btn pair">USE PAIRING CODE</a>
    </div>
</body>
</html>
